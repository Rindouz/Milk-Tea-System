
# ==================== \u7AEF\u53E3 ====================
server.port=8080

# ==================== Spring \u6838\u5FC3\u914D\u7F6E ====================
spring.application.name=Milk Tea System

# \u3010\u5173\u952E\u3011\u89E3\u51B3 Spring Boot 3.x \u4E0E Knife4j \u7684\u8DEF\u5F84\u5339\u914D\u51B2\u7A81
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ==================== \u6570\u636E\u6E90\u914D\u7F6E ====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/milktea?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root


# ==================== MyBatis-Plus ====================
# \u5F00\u542F SQL \u65E5\u5FD7\u6253\u5370
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# \u903B\u8F91\u5220\u9664\u5B57\u6BB5
# mybatis-plus.global-config.db-config.logic-delete-field=deleted
# mybatis-plus.global-config.db-config.logic-delete-value=1
# mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ==================== Knife4j \u63A5\u53E3\u6587\u6863\u914D\u7F6E ====================
knife4j.enable=true
knife4j.openapi.title=\u5976\u8336\u5E97\u7BA1\u7406\u7CFB\u7EDF\u63A5\u53E3\u6587\u6863
knife4j.openapi.description=API\u6587\u6863
knife4j.openapi.version=v1.0.0
knife4j.openapi.group.default.api-rule=package
knife4j.openapi.group.default.api-rule-resources[0]=com.example.milkteasystem.controller

# ==================== Sa-Token ====================
############## Sa-Token \u914D\u7F6E (\u6587\u6863: https://sa-token.cc) ##############

# token \u540D\u79F0\uFF08\u540C\u65F6\u4E5F\u662F cookie \u540D\u79F0\uFF09
sa-token.token-name=satoken
# token \u6709\u6548\u671F\uFF08\u5355\u4F4D\uFF1A\u79D2\uFF09 \u9ED8\u8BA430\u5929\uFF0C-1 \u4EE3\u8868\u6C38\u4E45\u6709\u6548
sa-token.timeout=2592000
# token \u6700\u4F4E\u6D3B\u8DC3\u9891\u7387\uFF08\u5355\u4F4D\uFF1A\u79D2\uFF09\uFF0C\u5982\u679C token \u8D85\u8FC7\u6B64\u65F6\u95F4\u6CA1\u6709\u8BBF\u95EE\u7CFB\u7EDF\u5C31\u4F1A\u88AB\u51BB\u7ED3\uFF0C\u9ED8\u8BA4-1 \u4EE3\u8868\u4E0D\u9650\u5236\uFF0C\u6C38\u4E0D\u51BB\u7ED3
sa-token.active-timeout=-1
# \u662F\u5426\u5141\u8BB8\u540C\u4E00\u8D26\u53F7\u591A\u5730\u540C\u65F6\u767B\u5F55 \uFF08\u4E3A true \u65F6\u5141\u8BB8\u4E00\u8D77\u767B\u5F55, \u4E3A false \u65F6\u65B0\u767B\u5F55\u6324\u6389\u65E7\u767B\u5F55\uFF09
sa-token.is-concurrent=true
# \u5728\u591A\u4EBA\u767B\u5F55\u540C\u4E00\u8D26\u53F7\u65F6\uFF0C\u662F\u5426\u5171\u7528\u4E00\u4E2A token \uFF08\u4E3A true \u65F6\u6240\u6709\u767B\u5F55\u5171\u7528\u4E00\u4E2A token, \u4E3A false \u65F6\u6BCF\u6B21\u767B\u5F55\u65B0\u5EFA\u4E00\u4E2A token\uFF09
sa-token.is-share=false
# token \u98CE\u683C\uFF08\u9ED8\u8BA4\u53EF\u53D6\u503C\uFF1Auuid\u3001simple-uuid\u3001random-32\u3001random-64\u3001random-128\u3001tik\uFF09
sa-token.token-style=uuid
# \u662F\u5426\u8F93\u51FA\u64CD\u4F5C\u65E5\u5FD7
sa-token.is-log=true


spring:
# Redis \u914D\u7F6E
    redis:
        host: localhost       # Redis \u670D\u52A1\u5668\u5730\u5740
         port: 6379            # Redis \u7AEF\u53E3
        password:             # Redis \u5BC6\u7801\uFF08\u65E0\u5219\u7559\u7A7A\uFF09
        database: 0           # \u6570\u636E\u5E93\u7D22\u5F15\uFF08\u9ED8\u8BA4 0\uFF09
        timeout: 10s          # \u8FDE\u63A5\u8D85\u65F6\u65F6\u95F4
# Lettuce \u8FDE\u63A5\u6C60\u914D\u7F6E
        lettuce:
            pool:
                max-active: 8     # \u6700\u5927\u6D3B\u8DC3\u8FDE\u63A5\u6570
                max-idle: 8       # \u6700\u5927\u7A7A\u95F2\u8FDE\u63A5\u6570
                min-idle: 0       # \u6700\u5C0F\u7A7A\u95F2\u8FDE\u63A5\u6570
                max-wait: -1ms    # \u83B7\u53D6\u8FDE\u63A5\u7684\u6700\u5927\u7B49\u5F85\u65F6\u95F4\uFF08-1 \u8868\u793A\u65E0\u9650\u5236\uFF09